/* ===========================================================================
   WUSOOL — design system  ·  LIGHT ONLY
   One thing per screen. Generous type. Monospace reserved for machine output.
   =========================================================================== */
:root{
  /* brand ramp */
  --brand-50:#eef4ff; --brand-100:#dbe7ff; --brand-200:#bcd1ff; --brand-300:#8eb1ff;
  --brand-400:#5a86ff; --brand-500:#3961fb; --brand-600:#2447ec; --brand-700:#1d36c9;
  --violet-400:#a855f7; --violet-500:#7c3aed; --violet-600:#6d28d9;

  /* semantic */
  --success:#059669; --success-ink:#047857; --success-soft:#ecfdf5; --success-line:#a7f3d0;
  --warning:#d97706; --warning-ink:#b45309; --warning-soft:#fffbeb; --warning-line:#fde68a;
  --danger:#dc2626;  --danger-ink:#b91c1c;  --danger-soft:#fef2f2;  --danger-line:#fecaca;
  --info:#0284c7;    --info-ink:#0369a1;    --info-soft:#f0f9ff;    --info-line:#bae6fd;

  /* chart slots — validated light, surface #fff */
  --c1:#3961fb; --c2:#d97706; --c3:#7c3aed; --c4:#059669;
  --chart-grid:rgba(15,23,42,.08);

  /* surfaces */
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8f9fc; --surface-3:#eef1f8;
  --glass:rgba(255,255,255,.82); --glass-strong:rgba(255,255,255,.95);
  --border:rgba(15,23,42,.09); --border-strong:rgba(15,23,42,.16);
  --ring:rgba(57,97,251,.32);
  --track:#eef1f8;

  /* text */
  --text-1:#0b1228; --text-2:#3d4a63; --text-3:#64708c; --text-muted:#8d97ad;

  /* effects */
  --shadow-soft:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --shadow-lift:0 6px 12px rgba(15,23,42,.06), 0 24px 48px rgba(15,23,42,.10);
  --shadow-card:0 1px 0 rgba(15,23,42,.04), 0 10px 30px -12px rgba(15,23,42,.13);
  --shadow-brand:0 10px 26px -10px rgba(57,97,251,.55);
  --gradient-brand:linear-gradient(135deg,#5a86ff 0%,#3961fb 52%,#6d28d9 100%);
  --hairline:linear-gradient(90deg,transparent,rgba(57,97,251,.3),transparent);

  --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-xl:24px; --radius-2xl:30px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* type — a real scale, not 11px everywhere */
  --fs-xs:13px; --fs-sm:14.5px; --fs-md:16px; --fs-lg:18px;
  --fs-xl:21px; --fs-2xl:26px; --fs-3xl:34px; --fs-4xl:46px;

  --f-sans:"Plus Jakarta Sans","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-ar:"Tajawal","Noto Kufi Arabic","SF Arabic","Geeza Pro",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--text-1);
  font-family:var(--f-sans); font-size:var(--fs-md); line-height:1.62;
  letter-spacing:-.006em; font-feature-settings:'cv02','cv03','cv04','ss01';
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
/* Arabic needs about one step more than Latin to read at the same comfort */
html[dir="rtl"] body{font-family:var(--f-ar); font-size:17px; letter-spacing:0;
  line-height:1.75; font-feature-settings:normal}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2.5px solid var(--brand-500);outline-offset:2px;border-radius:8px}
::selection{background:rgba(57,97,251,.18)}
svg{vertical-align:-.15em;flex:0 0 auto}
/* monospace is for machine output only — logs, coordinates, raw JSON. Never prices. */
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num,.tnum{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--text-2)} .dim{color:var(--text-3)}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate}
#app::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(62% 46% at 6% 0%, rgba(99,102,241,.11) 0%, transparent 62%),
    radial-gradient(48% 34% at 100% 3%, rgba(244,114,182,.09) 0%, transparent 60%),
    radial-gradient(46% 48% at 64% 100%, rgba(56,189,248,.09) 0%, transparent 62%);
}
.orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.42;pointer-events:none;z-index:-1;
  animation:float 15s ease-in-out infinite}
.orb.a{width:460px;height:460px;inset-block-start:-160px;inset-inline-start:-110px;
  background:radial-gradient(circle,rgba(90,134,255,.5),transparent 70%)}
.orb.b{width:400px;height:400px;inset-block-start:36%;inset-inline-end:-140px;
  background:radial-gradient(circle,rgba(168,85,247,.36),transparent 70%);animation-delay:-5s}
.orb.c{width:360px;height:360px;inset-block-end:-150px;inset-inline-start:40%;
  background:radial-gradient(circle,rgba(52,211,153,.28),transparent 70%);animation-delay:-9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;inset-block-start:0;z-index:60;display:flex;align-items:center;gap:18px;
  height:76px;flex:0 0 76px;padding-inline:24px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-block-end:1px solid var(--border);
}
.topbar::after{content:'';position:absolute;inset-inline:0;inset-block-end:-1px;height:1px;background:var(--hairline)}
.brand{display:flex;align-items:center;gap:13px;flex:0 0 auto}
.brand .mark{width:44px;height:44px;flex:0 0 44px;border-radius:15px;background:var(--gradient-brand);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-brand);color:#fff}
.brand .mark svg{width:24px;height:24px}
.brand .wm{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--text-1)}
html[dir="rtl"] .brand .wm{letter-spacing:0}
.brand .sub{font-size:var(--fs-xs);font-weight:600;color:var(--text-3);line-height:1.3;margin-block-start:1px}

.roles{display:flex;gap:4px;background:var(--surface-3);border-radius:16px;padding:5px;margin-inline:auto}
.role-tab{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:12px;
  font-size:var(--fs-sm);font-weight:650;color:var(--text-3);white-space:nowrap;
  transition:color .18s var(--ease),background .18s var(--ease)}
.role-tab svg{width:18px;height:18px}
.role-tab:hover{color:var(--text-1)}
.role-tab[aria-selected="true"]{background:var(--surface);color:var(--brand-500);box-shadow:var(--shadow-soft)}
.role-tab kbd{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:6px;
  background:var(--surface-3);color:var(--text-muted);font-weight:600}
.role-tab[aria-selected="true"] kbd{background:var(--brand-50);color:var(--brand-600)}

.topright{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.clock{font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--text-3);font-weight:500}
.seg-toggle{display:flex;background:var(--surface-3);border-radius:13px;padding:4px;gap:3px}
.seg-toggle button{padding:8px 14px;border-radius:10px;font-size:var(--fs-sm);font-weight:700;
  color:var(--text-3);transition:.18s var(--ease)}
.seg-toggle button:hover{color:var(--text-1)}
.seg-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--brand-500);box-shadow:var(--shadow-soft)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 3.5px var(--success-soft);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.86)}}

/* ---------- workspace ---------- */
.workspace{flex:1 1 auto;min-height:0}
.panel{display:none}
.panel.active{display:block;animation:fadeIn .28s var(--ease) both}
.stage{max-width:1080px;margin-inline:auto;padding:30px 24px 64px}
.stage.wide{max-width:1320px}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;gap:0;margin-block-end:26px;flex-wrap:wrap}
.stepper .st{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.stepper .dot{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:var(--fs-sm);font-weight:800;background:var(--surface);
  border:2px solid var(--border-strong);color:var(--text-muted);
  transition:.24s var(--spring)}
.stepper .dot svg{width:18px;height:18px}
.stepper .lb{font-size:var(--fs-sm);font-weight:650;color:var(--text-3);white-space:nowrap}
.stepper .st.on .dot{background:var(--gradient-brand);border-color:transparent;color:#fff;
  box-shadow:var(--shadow-brand);transform:scale(1.06)}
.stepper .st.on .lb{color:var(--text-1)}
.stepper .st.done .dot{background:var(--success);border-color:transparent;color:#fff}
.stepper .st.done .lb{color:var(--text-2)}
.stepper .bar{flex:1 1 26px;min-width:20px;height:2.5px;background:var(--border-strong);
  margin-inline:14px;border-radius:99px}
.stepper .bar.fill{background:var(--success)}

.step-head{margin-block-end:22px}
.step-head h2{margin:0;font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.035em;
  line-height:1.18;text-wrap:balance;color:var(--text-1)}
html[dir="rtl"] .step-head h2{letter-spacing:0;font-size:32px}
.step-head p{margin:9px 0 0;font-size:var(--fs-lg);color:var(--text-2);line-height:1.55;max-width:62ch}
html[dir="rtl"] .step-head p{font-size:17.5px}
.step-nav{display:flex;gap:12px;align-items:center;margin-block-start:26px;flex-wrap:wrap}
.step-nav .spacer{flex:1}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--surface-3);border-radius:16px;padding:5px;
  margin-block-end:22px;overflow-x:auto}
.tabs button{padding:11px 20px;border-radius:12px;font-size:var(--fs-sm);font-weight:650;
  color:var(--text-3);white-space:nowrap;display:flex;align-items:center;gap:9px;transition:.18s var(--ease)}
.tabs button svg{width:17px;height:17px}
.tabs button:hover{color:var(--text-1)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--brand-500);box-shadow:var(--shadow-soft)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-card);position:relative;
  transition:box-shadow .24s var(--ease),border-color .18s var(--ease);
  animation:slideUp .4s var(--ease) both}
.card:hover{border-color:var(--border-strong)}
.card-hd{display:flex;align-items:center;gap:12px;padding:22px 24px 0}
.card-hd h3{margin:0;font-size:var(--fs-lg);font-weight:750;letter-spacing:-.02em;color:var(--text-1)}
html[dir="rtl"] .card-hd h3{letter-spacing:0;font-size:19px}
.card-hd > svg{width:20px;height:20px;color:var(--brand-500);flex:0 0 20px}
.card-bd{padding:18px 24px 24px}
.eyebrow{display:block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted);margin-block-end:11px}
html[dir="rtl"] .eyebrow{letter-spacing:.01em;text-transform:none;font-size:14px}
.hr{height:1px;background:var(--border);margin-block:18px;border:0}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;
  font-size:var(--fs-xs);font-weight:650;line-height:1.5;white-space:nowrap;border:1px solid transparent}
html[dir="rtl"] .pill{font-size:14px}
.pill svg{width:15px;height:15px;flex:0 0 15px}
.pill.good{background:var(--success-soft);color:var(--success-ink);border-color:var(--success-line)}
.pill.warn{background:var(--warning-soft);color:var(--warning-ink);border-color:var(--warning-line)}
.pill.bad{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.pill.info{background:var(--info-soft);color:var(--info-ink);border-color:var(--info-line)}
.pill.brand{background:var(--brand-50);color:var(--brand-600);border-color:#c7d8ff}
.pill.neutral{background:var(--surface-3);color:var(--text-2);border-color:var(--border)}
.pill.lg{padding:9px 18px;font-size:var(--fs-sm)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;
  border-radius:var(--radius-md);font-size:var(--fs-md);font-weight:650;letter-spacing:-.012em;
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-1);
  box-shadow:var(--shadow-soft);
  transition:transform .18s var(--spring),box-shadow .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease)}
html[dir="rtl"] .btn{letter-spacing:0}
.btn svg{width:19px;height:19px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);border-color:var(--brand-300)}
.btn:active{transform:translateY(0) scale(.985)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.btn.primary{background:var(--gradient-brand);color:#fff;border-color:transparent;box-shadow:var(--shadow-brand)}
.btn.primary:hover{box-shadow:0 14px 34px -8px rgba(57,97,251,.6)}
.btn.good{background:var(--success);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(5,150,105,.7)}
.btn.warnfill{background:var(--warning);color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px rgba(217,119,6,.7)}
.btn.danger{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line);box-shadow:none}
.btn.danger:hover{background:#fee2e2}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent;color:var(--text-1)}
.btn.sm{padding:9px 16px;font-size:var(--fs-sm);border-radius:11px}
.btn.sm svg{width:16px;height:16px}
.btn.lg{padding:17px 30px;font-size:var(--fs-lg)}
.btn.block{width:100%}

/* ---------- segmented + chips ---------- */
.seg{display:flex;background:var(--surface-3);border-radius:14px;padding:4px;gap:3px}
.seg button{flex:1;padding:10px 15px;border-radius:11px;font-size:var(--fs-sm);font-weight:650;
  color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s var(--ease)}
.seg button svg{width:17px;height:17px}
.seg button:hover{color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-500);box-shadow:var(--shadow-soft)}

.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;
  border:1.5px solid var(--border);background:var(--surface);font-size:var(--fs-sm);font-weight:600;
  color:var(--text-2);box-shadow:var(--shadow-soft);
  transition:transform .18s var(--spring),border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.chip svg{width:16px;height:16px}
.chip:hover{transform:translateY(-1px);border-color:var(--brand-300);color:var(--text-1)}
.chip[aria-pressed="true"]{background:var(--gradient-brand);color:#fff;border-color:transparent;
  font-weight:700;box-shadow:var(--shadow-brand)}

/* ---------- fields ---------- */
textarea.field,input.field{width:100%;background:var(--surface-2);border:1.5px solid var(--border-strong);
  border-radius:var(--radius-md);padding:16px 18px;font-size:var(--fs-lg);line-height:1.65;
  color:var(--text-1);resize:vertical;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease)}
html[dir="rtl"] textarea.field,html[dir="rtl"] input.field{font-size:18px}
textarea.field:focus,input.field:focus{border-color:var(--brand-400);outline:none;
  background:var(--surface);box-shadow:0 0 0 4px var(--ring)}
textarea.field::placeholder,input.field::placeholder{color:var(--text-muted)}

/* ---------- entity tags ---------- */
.tagline{display:flex;flex-wrap:wrap;gap:10px}
.tok{padding:9px 16px;border-radius:14px;font-size:var(--fs-md);font-weight:600;line-height:1.4;
  border:1.5px solid transparent;animation:popIn .3s var(--spring) both}
html[dir="rtl"] .tok{font-size:17px}
.tok .lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  opacity:.72;margin-block-end:3px}
html[dir="rtl"] .tok .lbl{letter-spacing:0;text-transform:none;font-size:12.5px}
.tok.city{background:var(--brand-50);border-color:#c7d8ff;color:var(--brand-600)}
.tok.landmark{background:var(--warning-soft);border-color:var(--warning-line);color:var(--warning-ink)}
.tok.prep{background:var(--surface-3);border-color:var(--border);color:var(--text-2)}
.tok.building{background:var(--success-soft);border-color:var(--success-line);color:var(--success-ink)}
.tok.micro{background:#f5f3ff;border-color:#ddd6fe;color:var(--violet-600)}
.tok.plain{background:var(--surface-2);border-color:var(--border);color:var(--text-3)}

/* ---------- terminal log ---------- */
.log{background:#0b1226;border:1px solid #1e2a4d;border-radius:var(--radius-lg);
  padding:18px 20px;font-family:var(--f-mono);font-size:13px;line-height:1.95;color:#c5cce3;
  max-height:240px;overflow-y:auto;direction:ltr;text-align:left;
  scrollbar-width:thin;scrollbar-color:rgba(148,163,200,.35) transparent}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:rgba(148,163,200,.35);border-radius:999px}
.log .ln{white-space:pre-wrap;word-break:break-word;animation:fadeIn .22s both}
.log .c-key{color:#8eb1ff} .log .c-ok{color:#6ee7b7} .log .c-warn{color:#fcd34d}
.log .c-dim{color:#7c86a8} .log .c-bone{color:#e9d5ff}
.log .caret{display:inline-block;width:8px;height:14px;background:#6ee7b7;vertical-align:-2px;
  animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- meters + gauge ---------- */
.meter{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:currentColor;transition:width .85s var(--ease)}
.meter.sm{height:8px}
.gauge-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.gauge{position:relative;width:150px;height:150px;flex:0 0 150px}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .val b{font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.gauge .val span{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;color:var(--text-muted);
  margin-block-start:4px}
html[dir="rtl"] .gauge .val span{letter-spacing:.02em;font-size:14px}

.factors{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.factors li{display:flex;align-items:center;gap:12px;font-size:var(--fs-md);color:var(--text-2);
  padding:12px 4px;border-block-end:1px solid var(--border);animation:slideUp .34s var(--ease) both}
.factors li:last-child{border-block-end:0}
.factors li svg{width:20px;height:20px;flex:0 0 20px}
.factors li .pts{margin-inline-start:auto;font-size:var(--fs-md);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.factors li.on{color:var(--text-1)} .factors li.on svg{color:var(--success)} .factors li.on .pts{color:var(--success-ink)}
.factors li.off{opacity:.55} .factors li.off svg{color:var(--text-muted)} .factors li.off .pts{color:var(--text-muted)}

/* ---------- map ---------- */
.mapbox{position:relative;border-radius:var(--radius-xl);overflow:hidden;background:var(--surface-3);
  border:1px solid var(--border);box-shadow:var(--shadow-card)}
.mapbox canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapbox canvas:active{cursor:grabbing}
.map-ov{position:absolute;inset:0;pointer-events:none}
.map-ov > *{pointer-events:auto}
.map-tl{position:absolute;inset-block-start:16px;inset-inline-start:16px;display:flex;gap:9px;flex-wrap:wrap;max-inline-size:74%}
.map-tr{position:absolute;inset-block-start:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:9px}
.map-bl{position:absolute;inset-block-end:16px;inset-inline-start:16px}
.map-br{position:absolute;inset-block-end:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:9px}
.mbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:var(--glass-strong);border:1px solid var(--border);border-radius:13px;color:var(--text-2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-soft);
  transition:transform .18s var(--spring),color .18s var(--ease)}
.mbtn:hover{color:var(--brand-500);transform:translateY(-1px)}
.mbtn svg{width:20px;height:20px}
.map-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:12px;
  background:var(--glass-strong);border:1px solid var(--border);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-soft);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.map-chip svg{width:16px;height:16px;color:var(--brand-500)}
.map-chip b{color:var(--text-1);font-weight:750;font-variant-numeric:tabular-nums}
.map-chip .co{font-family:var(--f-mono);font-size:13px}
.confirm-bar{position:absolute;inset-block-end:16px;inset-inline:16px;display:flex;align-items:center;
  gap:16px;padding:18px 20px;border-radius:var(--radius-lg);background:var(--glass-strong);
  border:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow-lift);animation:slideUp .34s var(--ease) both;flex-wrap:wrap}
.confirm-bar p{margin:0;font-size:var(--fs-md);flex:1 1 240px;line-height:1.5}
.confirm-bar.ok{border-color:var(--success-line)}

/* ---------- doorway photo ---------- */
.photo{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);
  background:var(--surface-3);box-shadow:var(--shadow-soft)}
.photo canvas{display:block;width:100%;height:auto}
.photo .cap{position:absolute;inset-block-end:0;inset-inline:0;padding:26px 14px 12px;
  background:linear-gradient(180deg,transparent,rgba(6,10,25,.9));
  font-size:var(--fs-xs);font-weight:600;color:rgba(255,255,255,.9);display:flex;
  justify-content:space-between;gap:10px}
.photo .stamp{position:absolute;inset-block-start:12px;inset-inline-start:12px}

/* ---------- device frame ---------- */
.device{width:414px;max-width:100%;border-radius:52px;padding:13px;flex:0 0 auto;margin-inline:auto;
  background:linear-gradient(160deg,#e3e8f3,#bcc5da);
  box-shadow:0 44px 100px -34px rgba(15,23,42,.5), 0 0 0 1px rgba(15,23,42,.08)}
.screen{border-radius:40px;overflow:hidden;background:var(--bg);position:relative;height:764px;
  display:flex;flex-direction:column}
.notch{position:absolute;inset-block-start:0;inset-inline:0;height:34px;display:flex;align-items:center;
  justify-content:space-between;padding-inline:26px;font-size:var(--fs-xs);font-weight:700;
  color:var(--text-2);z-index:6;background:linear-gradient(180deg,var(--bg) 55%,transparent)}
.notch .sig{display:flex;align-items:center;gap:7px}
.notch svg{width:15px;height:15px}
.screen-body{flex:1;min-height:0;overflow-y:auto;padding:40px 15px 18px;display:flex;flex-direction:column;
  gap:13px;scrollbar-width:none}
.screen-body::-webkit-scrollbar{display:none}
.screen-body .card{border-radius:var(--radius-lg);animation:none}
.screen-body .card-hd{padding:15px 16px 0}
.screen-body .card-bd{padding:12px 16px 16px}

/* ---------- rows / tables ---------- */
.rows{display:flex;flex-direction:column;gap:3px}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--surface-2);
  border-radius:14px;font-size:var(--fs-md);transition:background .16s var(--ease)}
.row:hover{background:var(--surface-3)}
.row .sp{margin-inline-start:auto}
.rows .row > svg{width:19px;height:19px;color:var(--brand-500)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.tbl th{font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-muted);text-align:start;padding:14px 18px;border-block-end:1px solid var(--border)}
html[dir="rtl"] table.tbl th{letter-spacing:0;text-transform:none;font-size:14px}
table.tbl td{padding:16px 18px;border-block-end:1px solid var(--border);color:var(--text-2)}
table.tbl tr:last-child td{border-block-end:0}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl td.strong{color:var(--text-1);font-weight:650}
.tblwrap{overflow-x:auto}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column;gap:12px}
.feed-item{display:flex;gap:15px;padding:18px;background:var(--surface-2);border:1.5px solid transparent;
  border-radius:var(--radius-lg);animation:slideUp .42s var(--ease) both}
.feed-item .ic{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:flex;
  align-items:center;justify-content:center}
.feed-item .ic svg{width:21px;height:21px}
.feed-item .bd{min-width:0;flex:1}
.feed-item .t{font-size:var(--fs-md);line-height:1.55;color:var(--text-1)}
.feed-item .m{font-size:var(--fs-xs);color:var(--text-3);margin-block-start:9px;
  display:flex;gap:8px;flex-wrap:wrap}
.feed-item .m span{padding:4px 11px;border-radius:999px;background:var(--surface-3);font-weight:600}
.feed-item.fresh{border-color:var(--warning-line);background:var(--warning-soft);
  animation:popIn .4s var(--spring) both}

/* ---------- kpi ---------- */
.kpigrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.kpigrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.kpigrid{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:22px;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease);animation:slideUp .4s var(--ease) both}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.kpi .k{font-size:var(--fs-sm);font-weight:600;color:var(--text-3);line-height:1.4;min-height:40px}
.kpi .v{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.045em;color:var(--text-1);line-height:1;
  display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:var(--fs-md);font-weight:600;color:var(--text-3);letter-spacing:-.01em}
.kpi .d{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:650}
.kpi .d svg{width:16px;height:16px}

/* ---------- option cards ---------- */
.optcard{display:flex;gap:17px;padding:20px;border:1.5px solid var(--border);border-radius:var(--radius-lg);
  background:var(--surface);text-align:start;width:100%;align-items:flex-start;box-shadow:var(--shadow-soft);
  transition:transform .2s var(--spring),border-color .18s var(--ease),box-shadow .2s var(--ease),background .18s var(--ease)}
.optcard:hover{transform:translateY(-2px);border-color:var(--brand-300);box-shadow:var(--shadow-lift)}
.optcard[aria-pressed="true"]{border-color:var(--brand-400);background:var(--brand-50);
  box-shadow:0 0 0 4px var(--ring)}
.optcard .oi{width:50px;height:50px;flex:0 0 50px;border-radius:16px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.2s var(--ease)}
.optcard .oi svg{width:24px;height:24px}
.optcard[aria-pressed="true"] .oi{background:var(--gradient-brand);color:#fff;box-shadow:var(--shadow-brand)}
.optcard .ot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-lg);
  font-weight:700;color:var(--text-1);letter-spacing:-.015em}
html[dir="rtl"] .optcard .ot{letter-spacing:0}
.optcard .od{display:block;font-size:var(--fs-sm);color:var(--text-3);line-height:1.6;margin-block-start:6px}
.optcard .op{margin-inline-start:auto;font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.04em;
  color:var(--text-1);flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ---------- price ---------- */
.price{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.price .now{font-size:var(--fs-4xl);font-weight:800;letter-spacing:-.05em;line-height:1;
  background:var(--gradient-brand);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.price .was{font-size:var(--fs-2xl);font-weight:650;color:var(--text-muted);text-decoration:line-through;
  font-variant-numeric:tabular-nums}
.savebar{display:flex;align-items:center;gap:13px;padding:17px 19px;border-radius:var(--radius-md);
  background:var(--success-soft);border:1.5px solid var(--success-line);
  font-size:var(--fs-md);font-weight:600;color:var(--success-ink);animation:popIn .35s var(--spring) both}
.savebar svg{width:22px;height:22px;flex:0 0 22px}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:13px;padding:16px 18px;border-radius:var(--radius-md);
  font-size:var(--fs-md);line-height:1.55}
.banner svg{width:21px;height:21px;flex:0 0 21px}
.banner.good{background:var(--success-soft);border:1.5px solid var(--success-line);color:var(--success-ink)}
.banner.warn{background:var(--warning-soft);border:1.5px solid var(--warning-line);color:var(--warning-ink)}
.banner.bad{background:var(--danger-soft);border:1.5px solid var(--danger-line);color:var(--danger-ink)}
.banner.info{background:var(--info-soft);border:1.5px solid var(--info-line);color:var(--info-ink)}

/* ---------- mic / wave ---------- */
.mic{position:relative;width:64px;height:64px;flex:0 0 64px;border-radius:50%;background:var(--surface);
  border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);box-shadow:var(--shadow-soft);transition:.2s var(--spring)}
.mic svg{width:26px;height:26px}
.mic:hover{color:var(--brand-500);border-color:var(--brand-300);transform:translateY(-2px)}
.mic.rec{background:var(--danger);color:#fff;border-color:transparent;
  box-shadow:0 10px 28px -10px rgba(220,38,38,.7)}
.mic.rec::after{content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2.5px solid var(--danger);animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.86);opacity:.85}to{transform:scale(1.4);opacity:0}}
.wave{display:flex;align-items:center;gap:4px;height:44px;flex:1}
.wave i{flex:1;max-width:6px;background:var(--danger);border-radius:999px;min-height:5px;opacity:.85;
  animation:wv .85s ease-in-out infinite alternate}
@keyframes wv{from{height:14%}to{height:100%}}

/* ---------- sheet / toast ---------- */
.sheet{position:absolute;inset-block-end:0;inset-inline:0;background:var(--surface);
  border-block-start:1px solid var(--border);border-start-start-radius:30px;border-start-end-radius:30px;
  padding:20px;z-index:8;box-shadow:0 -24px 56px -22px rgba(15,23,42,.4);
  animation:sheetIn .32s var(--ease) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:46px;height:5px;border-radius:999px;background:var(--border-strong);margin:0 auto 18px}
.toast-wrap{position:fixed;inset-block-end:26px;inset-inline-end:26px;display:flex;flex-direction:column;
  gap:11px;z-index:90;pointer-events:none}
.toast{display:flex;align-items:center;gap:13px;padding:17px 21px;border-radius:var(--radius-lg);
  background:var(--glass-strong);border:1px solid var(--border);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-lift);font-size:var(--fs-md);
  max-width:400px;animation:popIn .34s var(--spring) both}
.toast svg{width:22px;height:22px;flex:0 0 22px;color:var(--success)}

/* ---------- charts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:20px;font-size:var(--fs-sm);color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:13px;height:13px;border-radius:4px;display:block}
.charttip{position:fixed;pointer-events:none;background:var(--glass-strong);border:1px solid var(--border);
  border-radius:14px;padding:12px 15px;font-size:var(--fs-sm);box-shadow:var(--shadow-lift);opacity:0;
  transition:opacity .12s;z-index:95;white-space:nowrap;backdrop-filter:blur(16px);

.charttip .tr{display:flex;align-items:center;gap:9px}
.charttip .tr i{width:11px;height:11px;border-radius:4px}
.charttip b{margin-inline-start:auto;padding-inline-start:16px;font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.bar-hit,.seg-hit{transition:opacity .16s var(--ease)}
.bar-hit:hover,.seg-hit:hover{opacity:.82}

/* ---------- layout helpers ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2.tight{gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.stack.tight{gap:14px}
.flexrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

@media (max-width:900px){

}

const MICRO_RE=[

  /(?:ال)?درج\s*[^\s،,]*/g, /(?:ال)?مدخل\s*[^\s،,]*/g,

function parseAddress(text){
  const out={segments:[],entities:{city:null,landmarks:[],preps:[],buildings:[],micro:[],areas:[]},cityLL:null};
  if(!text||!text.trim())return out;
  const phrases=text.split(/[،,\n]+|(?:\s-\s)/).map(s=>s.trim()).filter(Boolean);
  for(const ph of phrases){
    // city?
    let hitCity=null;
    for(const c of LEX.cities){
      if(ph.indexOf(c[0])>=0||ph.toLowerCase().indexOf(c[1].toLowerCase())>=0){hitCity=c;break;}
    }
    if(hitCity&&!out.entities.city){
      out.entities.city={ar:hitCity[0],en:hitCity[1]};out.cityLL=[hitCity[2],hitCity[3]];
      out.segments.push({type:'city',text:ph});continue;
    }
    // micro?
    let isMicro=false;
    for(const re of MICRO_RE){re.lastIndex=0;if(re.test(ph)){isMicro=true;break;}}
    if(isMicro){out.entities.micro.push(ph);out.segments.push({type:'micro',text:ph});continue;}
    // leading preposition?
    let prep=null,rest=ph;
    const allPreps=LEX.preps.concat(LEX.prepsEn);
    for(const p of allPreps){
      const low=ph.toLowerCase();
      if(low.startsWith(p.toLowerCase()+' ')||ph.startsWith(p+' ')){prep=p;rest=ph.slice(p.length).trim();break;}
    }
    if(prep){out.entities.preps.push(prep);out.segments.push({type:'prep',text:prep});}
    if(!rest){continue;}
    const low=rest.toLowerCase();
    const isB=LEX.bldg.some(k=>rest.indexOf(k)>=0)||LEX.bldgEn.some(k=>low.indexOf(k)>=0);
    const isL=LEX.land.some(k=>rest.indexOf(k)>=0)||LEX.landEn.some(k=>low.indexOf(k)>=0);
    if(isB&&!isL){out.entities.buildings.push(rest);out.segments.push({type:'building',text:rest});}
    else if(isL){out.entities.landmarks.push(rest);out.segments.push({type:'landmark',text:rest});}
    else if(rest.length<=28&&phrases.indexOf(ph)<2){out.entities.areas.push(rest);out.segments.push({type:'plain',text:rest});}
    else{out.entities.landmarks.push(rest);out.segments.push({type:'landmark',text:rest});}
  }
  return out;
}
function ghostMatch(parsed){
  const hits=[];
  const pool=parsed.entities.landmarks.concat(parsed.entities.buildings,parsed.entities.areas);
  for(const g of GHOST_DB){
    for(const s of pool){
      if(s.indexOf(g.ar)>=0||s.toLowerCase().indexOf(g.en.toLowerCase())>=0){hits.push(g);break;}
    }
  }
  return hits;
}
function nlpConfidence(parsed,ghosts,sc){
  let c=30;
  if(parsed.entities.city)c+=20;
  if(parsed.entities.landmarks.length)c+=10;
  if(ghosts.length)c+=12;
  if(parsed.entities.buildings.length)c+=12;
  if(parsed.entities.micro.length)c+=9;
  if(parsed.entities.preps.length)c+=6;
  if(sc&&sc.known)c+=8;
  return clamp(Math.round(c),18,97);
}

const M_LAT=110540, M_LNG=111320;
function projFrom(c0){ // lat/lng -> local metres around c0
  const k=Math.cos(c0[0]*Math.PI/180);
  return (lat,lng)=>[ (lng-c0[1])*M_LNG*k, -(lat-c0[0])*M_LAT ];
}

const cityCache={};
function genCity(seed,density){
  const key=seed+'|'+density;
  if(cityCache[key])return cityCache[key];
  const r=mulberry32(seed);
  const CFG={
    camp :{sp:[17,29], road:4.5, inset:0.9, hh:[7,17], veg:0.02, sub:[1,2]},
    dense:{sp:[30,52], road:7,   inset:2.2, hh:[9,22], veg:0.05, sub:[1,3]},
    urban:{sp:[46,86], road:9,   inset:4.0, hh:[8,20], veg:0.13, sub:[2,4]},
  }[density]||{sp:[40,70],road:8,inset:3,hh:[8,18],veg:.08,sub:[2,3]};
  const EXT=620;
  const xs=[],ys=[];
  for(let v=-EXT;v<EXT;v+=lerp(CFG.sp[0],CFG.sp[1],r()))xs.push(v);
  for(let v=-EXT;v<EXT;v+=lerp(CFG.sp[0],CFG.sp[1],r()))ys.push(v);
  // guarantee a block straddling the origin
  const roads=[];
  const primX=xs[Math.floor(xs.length*0.5)+1], primY=ys[Math.floor(ys.length*0.5)-1];
  xs.forEach(x=>roads.push({v:true,at:x,w:x===primX?CFG.road*2.1:CFG.road*(r()<.2?1.5:1)}));
  ys.forEach(y=>roads.push({v:false,at:y,w:y===primY?CFG.road*2.1:CFG.road*(r()<.2?1.5:1)}));
  const bldgs=[],trees=[];
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){
    const x0=xs[i]+CFG.road/1.4, x1=xs[i+1]-CFG.road/1.4;
    const y0=ys[j]+CFG.road/1.4, y1=ys[j+1]-CFG.road/1.4;
    if(x1-x0<8||y1-y0<8)continue;
    if(r()<CFG.veg){
      const n=3+Math.floor(r()*7);
      for(let k=0;k<n;k++)trees.push({x:lerp(x0,x1,r()),y:lerp(y0,y1,r()),r:2.2+r()*2.6});
      continue;
    }
    const nx=Math.max(1,Math.min(CFG.sub[1],Math.round((x1-x0)/lerp(11,20,r())))),
          ny=Math.max(1,Math.min(CFG.sub[1],Math.round((y1-y0)/lerp(11,20,r()))));
    const cw=(x1-x0)/nx, ch=(y1-y0)/ny;
    for(let a=0;a<nx;a++)for(let b=0;b<ny;b++){
      if(r()<0.07)continue;
      const ins=CFG.inset*(0.5+r());
      const bx=x0+a*cw+ins, by=y0+b*ch+ins;
      const bw=Math.max(5,cw-ins*2-r()*1.6), bh=Math.max(5,ch-ins*2-r()*1.6);
      bldgs.push({x:bx,y:by,w:bw,h:bh,
        rot:density==='urban'?(r()-.5)*0.06:(r()-.5)*0.02,
        z:lerp(CFG.hh[0],CFG.hh[1],r()),
        tone:0.74+r()*0.52,
        tanks:r()<.72?1+Math.floor(r()*3):0,
        stair:r()<.7});
    }
  }
  // target = building closest to origin; candidates = 3 nearest
  bldgs.sort((a,b)=>{
    const da=Math.hypot(a.x+a.w/2,a.y+a.h/2), db=Math.hypot(b.x+b.w/2,b.y+b.h/2);
    return da-db;
  });
  const cands=bldgs.slice(0,3).map(b=>({cx:b.x+b.w/2,cy:b.y+b.h/2,b:b}));
  const out={roads,bldgs,trees,cands,cfg:CFG};
  cityCache[key]=out;return out;
}

let noiseTile=null;
const patCache=new WeakMap();
function grainPattern(ctx){
  if(patCache.has(ctx))return patCache.get(ctx);

    const g=noiseTile.getContext('2d'),img=g.createImageData(96,96),r=mulberry32(7);

class MapEngine{

    this.cam=this.o.cam;this.t=0;this.dpr=Math.min(2,window.devicePixelRatio||1);

  }
  resize(){

    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);

      if(!drag)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));

  frame(ts){

    const r=this.cv.getBoundingClientRect();

  _road(ctx){

      ctx.fillRect(p[0],p[1],bw,bh);
    }
    for(const tr of C.trees){
      const p=this.s(tr.x,tr.y);
      ctx.fillStyle=P.rTree;ctx.beginPath();ctx.arc(p[0],p[1],tr.r*z,0,7);ctx.fill();
    }
    for(const pass of [0,1]){
      for(const rd of C.roads){
        const w=Math.max(1,rd.w*z);
        ctx.strokeStyle=pass?(rd.w>C.cfg.road*1.6?P.rMain:P.rFill):P.rCase;
        ctx.lineWidth=pass?w:w+3;
        ctx.lineCap='round';
        ctx.beginPath();
        if(rd.v){const a=this.s(rd.at,-700),b=this.s(rd.at,700);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
        else{const a=this.s(-700,rd.at),b=this.s(700,rd.at);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
        ctx.stroke();
      }
    }
    if(z>1.4){
      ctx.strokeStyle=P.rBldgLine;ctx.lineWidth=1;ctx.fillStyle=P.rBldg;
      for(const b of C.bldgs){
        const p=this.s(b.x,b.y),bw=b.w*z,bh=b.h*z;
        if(p[0]+bw<0||p[0]>this.w||p[1]+bh<0||p[1]>this.h)continue;
        ctx.fillRect(p[0],p[1],bw,bh);
        ctx.strokeRect(p[0]+.5,p[1]+.5,bw,bh);
      }
    }
    this._labels(ctx,false);
  }
  _labels(ctx,sat){
    if(this.cam.zoom<0.85)return;
    ctx.save();ctx.direction=LANG==='ar'?'rtl':'ltr';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='600 11.5px '+(LANG==='ar'?'Tajawal,"SF Arabic",sans-serif':'"Plus Jakarta Sans",system-ui,sans-serif');
    for(const L of this.o.labels){
      const p=this.s(L.x,L.y);
      if(p[0]<20||p[0]>this.w-20||p[1]<14||p[1]>this.h-14)continue;
      const txt=L.text[LANG]||L.text;
      // satellite imagery is photographic in both themes, so labels stay light there
      ctx.lineWidth=3.6;
      ctx.strokeStyle=sat?'rgba(8,12,20,.8)':P.labelHalo;
      ctx.strokeText(txt,p[0],p[1]);
      ctx.fillStyle=L.kind==='ghost'?(sat?'#fcd34d':P.warn):(sat?'rgba(244,246,255,.94)':P.label);
      ctx.fillText(txt,p[0],p[1]);
      if(L.kind==='ghost'){
        ctx.fillStyle=sat?'#fbbf24':P.warn;
        ctx.beginPath();ctx.arc(p[0],p[1]-11,2.6,0,7);ctx.fill();
      }
    }
    ctx.restore();
  }
  /* -------- regional ops map -------- */
  _region(ctx){
    const R=this.o.region,z=this.cam.zoom;
    ctx.fillStyle=P.gBg;ctx.fillRect(0,0,this.w,this.h);
    const r=mulberry32(404);
    const blobs=20;   // fewer, broader washes read as relief, not smudge
    for(let i=0;i<blobs;i++){
      const lat=lerp(31.25,32.62,r()),lng=lerp(34.88,35.60,r());
      const p=this.s.apply(this,R.pr(lat,lng));
      const rad=(9000+r()*18000)*z;
      const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],rad);
      const east=lng>35.42;
      g.addColorStop(0,east?P.gEast:P.gLand);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],rad,0,7);ctx.fill();
    }
    // Jordan valley / Dead Sea band
    ctx.save();
    ctx.fillStyle=P.gWater;ctx.beginPath();
    const band=[[31.80,35.50],[31.72,35.56],[31.55,35.55],[31.40,35.50],[31.28,35.46],[31.30,35.58],[31.55,35.62],[31.82,35.58]];
    band.forEach((c,i)=>{const p=this.s.apply(this,R.pr(c[0],c[1]));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});
    ctx.closePath();ctx.fill();ctx.restore();
    // highways
    ctx.lineCap='round';ctx.lineJoin='round';
    for(const hw of R.highways){
      ctx.beginPath();
      hw.pts.forEach((c,i)=>{const p=this.s.apply(this,R.pr(c[0],c[1]));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});
      ctx.strokeStyle=P.gRoadCase;ctx.lineWidth=hw.main?7:4.5;ctx.stroke();
      ctx.strokeStyle=P.gRoad;ctx.lineWidth=hw.main?4:2.4;ctx.globalAlpha=hw.main?1:.75;ctx.stroke();
      ctx.globalAlpha=1;
    }
    // graticule — turns the empty sea/desert margin into instrument, not blank canvas
    ctx.save();
    ctx.strokeStyle=P.gGrid;ctx.lineWidth=1;
    ctx.font='9.5px "JetBrains Mono",ui-monospace,Menlo,monospace';ctx.fillStyle=P.gGridInk;
    ctx.direction='ltr';ctx.textAlign='left';ctx.textBaseline='alphabetic';
    for(let lat=31.2;lat<=32.8;lat+=0.2){
      const p=this.s.apply(this,R.pr(lat,35.2));
      if(p[1]<10||p[1]>this.h-6)continue;
      ctx.beginPath();ctx.moveTo(0,p[1]);ctx.lineTo(this.w,p[1]);ctx.stroke();
      ctx.fillText(lat.toFixed(1)+'°N',6,p[1]-4);
    }
    for(let lng=34.8;lng<=35.8;lng+=0.2){
      const p=this.s.apply(this,R.pr(31.95,lng));
      if(p[0]<24||p[0]>this.w-32)continue;
      ctx.beginPath();ctx.moveTo(p[0],0);ctx.lineTo(p[0],this.h);ctx.stroke();
      ctx.fillText(lng.toFixed(1)+'°E',p[0]+4,this.h-8);
    }
    // north arrow + scale bar
    ctx.strokeStyle=P.gGridInk;ctx.fillStyle=P.gGridInk;ctx.lineWidth=1.4;
    const nx=this.w-30,ny=26;
    ctx.beginPath();ctx.moveTo(nx,ny+13);ctx.lineTo(nx,ny-9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(nx,ny-13);ctx.lineTo(nx-4,ny-5);ctx.lineTo(nx+4,ny-5);ctx.closePath();ctx.fill();
    ctx.textAlign='center';ctx.fillText('N',nx,ny+24);
    const km=10,px=km*1000*z;
    if(px>24&&px<this.w*0.5){
      const bx=this.w/2-px/2,by=this.h-16;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+px,by);
      ctx.moveTo(bx,by-4);ctx.lineTo(bx,by+4);ctx.moveTo(bx+px,by-4);ctx.lineTo(bx+px,by+4);ctx.stroke();
      ctx.fillText(km+' km',bx+px/2,by-8);
    }
    ctx.restore();
    ctx.save();ctx.globalAlpha=.22;ctx.fillStyle=grainPattern(ctx);
    ctx.fillRect(0,0,this.w,this.h);ctx.restore();
  }
}

function drawPin(ctx,x,y,color,t,label){

  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-11,-13,-9,-27,0,-27);
  ctx.bezierCurveTo(9,-27,11,-13,0,0);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.shadowBlur=0;

    ctx.font='700 10px "JetBrains Mono",ui-monospace,Menlo,monospace';ctx.textAlign='center';

function drawHalo(ctx,x,y,r,color,t){
  const k=(t%2)/2;
  ctx.save();
  ctx.globalAlpha=.55*(1-k);ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r*(0.4+k*0.75),0,7);ctx.stroke();
  ctx.restore();
}
function dashRing(ctx,x,y,r,color,fill,t){
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,7);
  ctx.fillStyle=fill;ctx.fill();
  ctx.setLineDash([6,5]);ctx.lineDashOffset=-t*9;
  ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.stroke();
  ctx.restore();
}

/* ============================================================
   6 · DOORWAY "PHOTO" RENDERER (procedural reconstruction)
   ============================================================ */
function drawDoorway(cv,seed,gate){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth||320,H=Math.round(W*0.66);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const r=mulberry32(seed);
  const GATES={blue:['#2E5B7A','#1E4159'],brown:['#6B4526','#4A2F19'],green:['#3A5A34','#26391F'],grey:['#4A5157','#333A3F']};
  const G=GATES[gate]||GATES.brown;
  // sky sliver
  const sky=c.createLinearGradient(0,0,0,H*.3);
  sky.addColorStop(0,'#A9BBC4');sky.addColorStop(1,'#8496A0');
  c.fillStyle=sky;c.fillRect(0,0,W,H*.30);
  // limestone wall
  const wall=c.createLinearGradient(0,H*.1,0,H);
  wall.addColorStop(0,'#B6AE99');wall.addColorStop(.55,'#9C947F');wall.addColorStop(1,'#7C7562');
  c.fillStyle=wall;c.fillRect(0,H*.10,W,H*.9);
  // stone courses
  const rows=8,rh=(H*.9)/rows;
  for(let i=0;i<rows;i++){
    const y=H*.10+i*rh, off=(i%2)*(W/9);
    c.strokeStyle='rgba(60,55,44,.28)';c.lineWidth=1.4;
    c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();
    for(let x=off;x<W;x+=W/4.5){
      c.beginPath();c.moveTo(x,y);c.lineTo(x,y+rh);c.stroke();
    }
    c.fillStyle='rgba(255,255,255,'+(0.02+r()*0.05)+')';c.fillRect(0,y+1,W,rh*.4);
  }
  // doorway recess
  const dw=W*.30,dh=H*.56,dx=W*.34,dy=H*.36;
  c.fillStyle='rgba(30,26,20,.55)';c.fillRect(dx-6,dy-8,dw+12,dh+8);
  // lintel
  c.fillStyle='#8A8270';c.fillRect(dx-10,dy-16,dw+20,10);
  // gate
  const gg=c.createLinearGradient(dx,dy,dx+dw,dy+dh);
  gg.addColorStop(0,G[0]);gg.addColorStop(1,G[1]);
  c.fillStyle=gg;c.fillRect(dx,dy,dw,dh);
  c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=2;c.strokeRect(dx,dy,dw,dh);
  for(let i=1;i<6;i++){
    c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1.2;
    c.beginPath();c.moveTo(dx+dw*i/6,dy);c.lineTo(dx+dw*i/6,dy+dh);c.stroke();
  }
  c.strokeStyle='rgba(255,255,255,.16)';c.lineWidth=1;
  c.beginPath();c.moveTo(dx,dy+dh*.42);c.lineTo(dx+dw,dy+dh*.42);c.stroke();
  c.fillStyle='#C8C2B2';c.beginPath();c.arc(dx+dw*.86,dy+dh*.52,2.6,0,7);c.fill();
  // steps
  c.fillStyle='#8D8674';c.fillRect(dx-14,dy+dh,dw+28,H*.05);
  c.fillStyle='#7A735F';c.fillRect(dx-20,dy+dh+H*.05,dw+40,H*.045);
  // number plate
  c.fillStyle='#1E3F63';c.fillRect(dx+dw+10,dy+4,W*.11,H*.09);
  c.fillStyle='#EDE6D8';c.font='700 '+Math.round(H*.055)+'px ui-monospace,Menlo,monospace';
  c.textAlign='center';c.textBaseline='middle';
  c.fillText(String(7+Math.floor(r()*40)),dx+dw+10+W*.055,dy+4+H*.045);
  // electricity box + cables + dish
  c.fillStyle='#5E5A4C';c.fillRect(W*.08,H*.40,W*.07,H*.10);
  c.strokeStyle='rgba(30,28,22,.65)';c.lineWidth=1.6;
  c.beginPath();c.moveTo(0,H*.20);c.bezierCurveTo(W*.3,H*.26,W*.7,H*.16,W,H*.22);c.stroke();
  c.beginPath();c.moveTo(0,H*.24);c.bezierCurveTo(W*.35,H*.31,W*.65,H*.21,W,H*.26);c.stroke();
  c.save();c.translate(W*.83,H*.24);c.rotate(-.34);
  c.fillStyle='#C3BCA9';c.beginPath();c.ellipse(0,0,W*.055,W*.038,0,0,7);c.fill();
  c.strokeStyle='#6E6857';c.lineWidth=1.6;c.beginPath();c.moveTo(0,0);c.lineTo(W*.03,H*.07);c.stroke();
  c.restore();
  // plants
  c.fillStyle='#3E4B27';
  for(let i=0;i<9;i++){
    const px=W*.13+r()*W*.10,py=H*.90;
    c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+(r()-.5)*20,py-H*.09,px+(r()-.5)*26,py-H*.14);
    c.lineWidth=2.2;c.strokeStyle='#3E4B27';c.stroke();
  }
  c.fillStyle='#7A4F33';c.fillRect(W*.12,H*.895,W*.11,H*.075);
  // ground
  c.fillStyle='#6E6858';c.fillRect(0,H*.955,W,H*.05);
  // photographic finish
  c.save();c.globalAlpha=.26;c.fillStyle=grainPattern(c);c.fillRect(0,0,W,H);c.restore();
  const vg=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
  const warm=c.createLinearGradient(0,0,W,H);
  warm.addColorStop(0,'rgba(255,208,140,.10)');warm.addColorStop(1,'rgba(0,20,40,.10)');
  c.fillStyle=warm;c.fillRect(0,0,W,H);
}

function svgSpark(data,color,w,h){
  w=w||120;h=h||30;
  const mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),sp=(mx-mn)||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w,h-((v-mn)/sp)*(h-6)-3]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+' L'+w+' '+h+' L0 '+h+' Z';
  const id='g'+Math.random().toString(36).slice(2,8);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+color+'" stop-opacity=".34"/>'+
    '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="2.4" fill="'+color+'"/></svg>';
}

function lineChart(cfg){
  const CH=chart();
  const W=cfg.w||520,H=cfg.h||190,PL=38,PR=54,PT=14,PB=26;
  const iw=W-PL-PR,ih=H-PT-PB;
  const all=cfg.series.reduce((a,s)=>a.concat(s.data),[]);
  const mx=Math.ceil(Math.max.apply(null,all)/10)*10, mn=Math.floor(Math.min.apply(null,all)/10)*10-0;
  const X=i=>PL+i/(cfg.labels.length-1)*iw;
  const Y=v=>PT+ih-((v-mn)/((mx-mn)||1))*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+iw)+'" y2="'+y.toFixed(1)+'" stroke="'+CH.grid+'" stroke-width="1"/>'+
       '<text x="'+(PL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="'+CH.ink3+'" font-family="ui-monospace,Menlo,monospace">'+Math.round(v)+'</text>';}
  cfg.labels.forEach((l,i)=>{g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="'+CH.ink3+'" font-family="ui-monospace,Menlo,monospace">'+l+'</text>';});
  cfg.series.forEach(s=>{
    const d=s.data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
    s.data.forEach((v,i)=>{g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="'+s.color+'" stroke="'+CH.surface+'" stroke-width="1.6"/>';});
    const last=s.data.length-1;
    g+='<text x="'+(X(last)+8)+'" y="'+(Y(s.data[last])+3.5).toFixed(1)+'" font-size="10" font-weight="700" fill="'+s.color+'" font-family="ui-monospace,Menlo,monospace">'+s.data[last]+'</text>';
  });
  cfg.labels.forEach((l,i)=>{
    const x0=PL+(i-0.5)/(cfg.labels.length-1)*iw;
    g+='<rect class="hit" data-i="'+i+'" x="'+Math.max(0,x0).toFixed(1)+'" y="'+PT+'" width="'+(iw/(cfg.labels.length-1)).toFixed(1)+'" height="'+ih+'" fill="transparent"/>';
  });
  g+='<line class="cross" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" stroke="'+CH.ink3+'" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  return {svg:'<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img">'+g+'</svg>',X:X,Y:Y,W:W,H:H};
}

/* ============================================================
   API — the real backend when it is running, the in-browser
   simulation when it is not. Never a dead end on stage.
   ============================================================ */
const API = { base:'/api', live:false, engine:'', probed:false };
/* The stage customer. `let`, not `const`, so the e2e harness can hand each run
   its own number — otherwise the second run resolves at tier 1 off the address
   the first run pinned, and the test reports a regression that is really just
   the product working. */
let DEMO_PHONE = '0599111222';

async function apiProbe(){
  try{
    const c = new AbortController();
    const t = setTimeout(()=>c.abort(), 1500);
    const r = await fetch(API.base+'/health', {signal:c.signal});
    clearTimeout(t);
    const j = await r.json();
    API.live = !!j.ok; API.engine = j.llm || '';
  }catch{ API.live = false; }
  API.probed = true;
  const el = $('#modepill'); if(el) el.outerHTML = modePill();
  return API.live;
}
async function apiPost(p, body){
  const r = await fetch(API.base+p, {method:'POST',
    headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiGet(p){
  const r = await fetch(API.base+p);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function modePill(){

/* backend Resolution -> the shape the customer screens already render */
const REL_AR = {near:'قرب', next_to:'جنب', behind:'خلف', opposite:'مقابل', above:'فوق',
  below:'تحت', after:'بعد', before:'قبل', at:'عند', inside:'داخل', between:'بين',
  entrance_of:'مدخل', downslope:'نزلة', upslope:'طلعة', start_of:'أول', end_of:'آخر'};
function relLabel(r){ return LANG==='ar' ? (REL_AR[r]||r) : String(r).replace(/_/g,' '); }

function adaptResolution(res){
  const p = res.parsed || {};
  const segs = [];
  if(p.city) segs.push({type:'city', text:p.city});
  if(p.area) segs.push({type:'plain', text:p.area});
  (p.relations||[]).forEach(r=>{
    segs.push({type:'prep', text:relLabel(r.relation)});
    if(r.object && r.object!==p.building && !(p.landmarks||[]).some(l=>l.name===r.object)) return;
  });
  if(p.building) segs.push({type:'building', text:p.building});
  (p.landmarks||[]).forEach(l=>segs.push({type:'landmark', text:l.name}));
  if(p.floor) segs.push({type:'micro', text:(LANG==='ar'?'طابق ':'floor ')+p.floor});
  if(p.apartment) segs.push({type:'micro', text:p.apartment});
  return {
    segments: segs,
    entities: {
      city: p.city ? {ar:p.city, en:p.city} : null,
      areas: p.area ? [p.area] : [],
      landmarks: (p.landmarks||[]).map(l=>l.name),
      buildings: p.building ? [p.building] : [],
      micro: [p.floor && ((LANG==='ar'?'طابق ':'floor ')+p.floor), p.apartment].filter(Boolean),
      preps: (p.relations||[]).map(r=>r.relation),
    },
    cityLL: res.lat!=null ? [res.lat, res.lng] : null,
  };
}

/* the real engine trace, straight from the server's explain[] */
function liveLog(res){
  const L = [];
  L.push(['dim','$ POST /api/resolve   engine='+res.engine]);
  const p = res.parsed||{};
  if(p.city) L.push(['ok','ner.CITY      -> "'+p.city+'"']);
  if(p.area) L.push(['dim','ner.AREA      -> "'+p.area+'"']);
  (p.relations||[]).forEach(r=>L.push(['key','spatial.rel   -> '+r.relation+' ("'+r.object+'")']));
  (p.landmarks||[]).forEach(l=>L.push(['key','ner.LANDMARK  -> "'+l.name+'"  ['+l.type+']']));
  if(p.building) L.push(['key','ner.BUILDING  -> "'+p.building+'"']);
  if(p.floor) L.push(['key','ner.MICRO     -> floor '+p.floor]);
  if(p.apartment) L.push(['key','ner.MICRO     -> "'+p.apartment+'"']);
  (res.matched_entities||[]).forEach(e=>L.push([
    e.source==='osm'?'dim':'warn',
    'graph.match   -> #'+e.id+' "'+e.name+'"  ['+e.source+' conf '+Number(e.confidence).toFixed(2)+']']));
  (res.explain||[]).forEach(x=>L.push(['bone','· '+x]));
  L.push(['ok','tier '+res.tier+'   confidence = '+Number(res.confidence).toFixed(2)+
               '   '+String(res.status).toUpperCase()]);
  if(res.lat!=null) L.push(['ok','geocode       -> '+res.lat.toFixed(5)+', '+res.lng.toFixed(5)]);
  return L;
}

function curSc(){return SCEN.find(s=>s.id===S.c.sc);}
function addrRecord(){
  const sc=curSc();
  if(S.c.presetId===sc.id)return {known:sc.known,photo:sc.photo,drops:sc.drops,
    radius:sc.radius,density:sc.density,code:sc.code,cityLab:sc.cityLab,zone:sc.zone};
  const p=S.c.parsed;
  const camp=p&&p.entities.city&&(/مخيم/.test(p.entities.city.ar)||/camp/i.test(p.entities.city.en));
  return {known:false,photo:false,drops:0,radius:95,density:camp?'camp':'urban',
    code:'NEW-'+(S.c.text.length*7%9000+1000),cityLab:p&&p.entities.city?p.entities.city:{ar:'—',en:'—'},
    zone:{ar:'عنوان جديد',en:'New address'}};
}
function computeConfidence(parsed,ghosts,rec){
  const e=parsed.entities;let c=22;
  if(e.city)c+=14;
  let gp=0;ghosts.forEach(g=>{gp+=Math.min(10,3+g.drops*0.7);});
  c+=Math.min(22,gp);
  c+=Math.min(8,Math.max(0,e.landmarks.length-ghosts.length)*4);
  let proper=false,generic=false;
  e.buildings.forEach(b=>{
    if(/^(عمارة|بناية|برج|مجمع|فيلا|بلوك)\s+\S+/.test(b)||/\b(building|tower|block|complex|villa)\b/i.test(b))proper=true;
    else generic=true;});
  if(proper)c+=14;else if(generic)c+=4;
  if(e.micro.length)c+=8;
  if(e.preps.length)c+=5;
  c-=(rec.density==='camp'?24:rec.density==='dense'?4:8);
  if(rec.known)c+=14;
  return clamp(Math.round(c),12,97);
}
function trustCalc(){
  const c=S.c,rec=addrRecord();
  const F=[
    {k:'fNlp',  on:c.analysed,                    pts:c.analysed?Math.round(c.conf*0.25):0, max:25},
    {k:'fGhost',on:c.analysed&&c.ghosts.length>0, pts:(c.analysed&&c.ghosts.length)?12:0,   max:12},
    {k:'fPin',  on:c.footprint===true,            pts:c.footprint===true?20:0,              max:20},
    {k:'fMicro',on:c.micro.trim().length>=4,      pts:c.micro.trim().length>=4?12:0,        max:12},
    {k:'fHist', on:rec.drops>0,                   pts:Math.min(18,Math.round(rec.drops*3.5)),max:18},
    {k:'fPhoto',on:!!rec.photo,                   pts:rec.photo?8:0,                        max:8},
    {k:'fVoice',on:c.voiceUsed,                   pts:c.voiceUsed?5:0,                      max:5},
  ];
  let tot=F.reduce((a,f)=>a+f.pts,0);
  // every evidence channel except the optional voice note ⇒ a fully trusted address
  if(F.filter(f=>f.k!=='fVoice').every(f=>f.on))tot=100;
  return {F:F,total:clamp(tot,0,100)};
}
function feeFor(trust,option){
  const base=trust>=85?14:trust>=70?15:trust>=55?17:20;
  if(option==='dukkan')return 10;
  if(option==='neighbor')return Math.round(base*0.6*2)/2;
  return base;
}
function confColor(v){return v>=80?P.good:v>=60?P.warn:P.bad;}
function tint(hex,a){const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';}

function buildLog(parsed,ghosts,conf,rec){
  const e=parsed.entities,L=[];
  const toks=(S.c.text.match(/\S+/g)||[]).length;
  L.push(['dim','$ wusool parse --lang ar-PS --base osm --history on']);

  if(e.city)L.push(['ok','ner.CITY      → "'+e.city.ar+'"  ⇒  '+(parsed.cityLL?parsed.cityLL[0].toFixed(4)+', '+parsed.cityLL[1].toFixed(4):'—')]);
  e.areas.forEach(a=>L.push(['dim','ner.AREA      → "'+a+'"  (neighbourhood, unmapped)']));
  e.preps.forEach(p=>L.push(['key','spatial.rel   → "'+p+'"  ⇒  '+relOf(p)]));
  e.landmarks.forEach(l=>L.push(['key','ner.LANDMARK  → "'+l+'"']));
  e.buildings.forEach(b=>L.push(['key','ner.BUILDING  → "'+b+'"']));
  e.micro.forEach(m=>L.push(['key','ner.MICRO     → "'+m+'"  (last-10-metres slot)']));
  if(ghosts.length)ghosts.forEach(g=>L.push(['warn','ghost_db.get("'+g.ar+'")  HIT  '+g.ll[0].toFixed(5)+','+g.ll[1].toFixed(5)+'  n='+g.drops+' drops']));
  else L.push(['warn','ghost_db.get(...)  MISS — no cultural landmark on file yet']);
  L.push(['dim','osm.footprint  → way/'+(3840000+((rec.code||'x').length*911)%90000)+'   '+(8+((conf*3)%14)|0)+'×'+(11+((conf*5)%16)|0)+' m']);
  L.push([rec.drops?'ok':'warn','history.join()  → '+rec.drops+' prior successful drop-offs at this node']);
  if(rec.density==='camp')L.push(['warn','fabric=UNPLANNED  camp layout · no street grid · penalty −24']);
  const sc=curSc();
  L.push(['ok','geocode        → '+sc.center[0].toFixed(5)+', '+sc.center[1].toFixed(5)+'   ±'+rec.radius+' m']);
  L.push(['bone','confidence = '+(conf/100).toFixed(2)+'   '+(conf>=80?'ACCEPT':conf>=60?'CONFIRM_WITH_USER':'REQUIRE_PIN')]);
  return L;
}
function relOf(p){
  const m={'قرب':'proximity r≤60m','بجانب':'adjacency','جنب':'adjacency','خلف':'bearing 180°','ورا':'bearing 180°','وراء':'bearing 180°',
    'فوق':'vertical +1..n floors','تحت':'vertical −1','مقابل':'across-street','قبالة':'across-street','بعد':'along-path after',
    'قبل':'along-path before','أمام':'bearing 0°','امام':'bearing 0°','عند':'at-node','مدخل':'entrance node','نزلة':'downslope','طلعة':'upslope','بين':'between two nodes'};
  return m[p]||'proximity';
}
async function runAnalyse(){
  const c=S.c;
  if(c.logTimer){clearInterval(c.logTimer);c.logTimer=null;}
  if(API.live){
    try{
      const res=await apiPost('/resolve',{raw_text:c.text, phone:DEMO_PHONE});
      c.backend=res; c.orderId=null; c.pinToken=null;
      c.parsed=adaptResolution(res);
      c.ghosts=(res.matched_entities||[]).filter(e=>e.source!=='osm');
      c.conf=Math.round(res.confidence*100);
      c.analysed=true; c.picking=false;
      if(!c.keepPin)c.footprint=null;
      c.keepPin=false;
      const p=res.parsed||{};
      if(!c.microTouched)
        c.micro=[p.floor&&((LANG==='ar'?'طابق ':'floor ')+p.floor),p.apartment]
                .filter(Boolean).join(LANG==='ar'?'، ':', ');
      const full=liveLog(res);
      c.log=[]; let i=0;
      // Re-render phone screen with the parsed data
      if(typeof renderCustScreen==='function') renderCustScreen(S.c.step||2);
      c.logTimer=setInterval(()=>{
        if(i>=full.length){clearInterval(c.logTimer);c.logTimer=null;renderEngine();return;}
        c.log.push(full[i++]);renderEngine();
      },100);
      return;
    }catch(e){
      API.live=false;
      toast(LANG==='ar'?'تعذّر الوصول للخادم — تحويل لوضع العرض':'Backend unreachable — falling back to simulation','alert');
    }
  }
  c.backend=null;
  c.parsed=parseAddress(c.text);
  c.ghosts=ghostMatch(c.parsed);
  const rec=addrRecord();
  c.conf=computeConfidence(c.parsed,c.ghosts,rec);
  c.analysed=true;c.picking=false;
  if(!c.keepPin)c.footprint=null;
  c.keepPin=false;
  if(!c.microTouched)c.micro=c.parsed.entities.micro.join(LANG==='ar'?'، ':', ');
  const full=buildLog(c.parsed,c.ghosts,c.conf,rec);
  c.log=[];
  let i=0;
  c.logTimer=setInterval(()=>{
    if(i>=full.length){clearInterval(c.logTimer);c.logTimer=null;renderEngine();return;}
    c.log.push(full[i++]);renderEngine();
  },135);
}

function custOverlay(ctx,m){
  const c=S.c,t=m.t;
  if(!c.analysed)return;
  const city=m.city,cand=city.cands[c.candIdx];
  const p=m.s(cand.cx,cand.cy);
  const good=c.footprint===true;
  const col=good?P.good:confColor(c.conf);
  const rec=addrRecord();
  const radM=good?9:rec.radius*(0.55+(100-c.conf)/140);
  dashRing(ctx,p[0],p[1],Math.max(16,radM*m.cam.zoom),col,tint(col,.13),t);
  drawHalo(ctx,p[0],p[1],Math.max(16,radM*m.cam.zoom),col,t);
  const b=cand.b,z=m.cam.zoom,bp=m.s(b.x,b.y);
  ctx.save();ctx.translate(bp[0]+b.w*z/2,bp[1]+b.h*z/2);ctx.rotate(b.rot);
  ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.setLineDash([]);
  ctx.strokeRect(-b.w*z/2,-b.h*z/2,b.w*z,b.h*z);
  ctx.fillStyle=tint(col,.16);ctx.fillRect(-b.w*z/2,-b.h*z/2,b.w*z,b.h*z);
  ctx.restore();
  if(c.footprint===false){
    city.cands.forEach((cd,i)=>{
      if(i===c.candIdx)return;
      const q=m.s(cd.b.x,cd.b.y);
      ctx.save();ctx.setLineDash([6,5]);ctx.lineDashOffset=-t*8;
      ctx.strokeStyle=m.o.satellite?'#f4f6ff':P.brand;ctx.lineWidth=2.2;
      ctx.strokeRect(q[0],q[1],cd.b.w*z,cd.b.h*z);
      ctx.fillStyle=m.o.satellite?'rgba(244,246,255,.12)':tint(P.brand,.12);
      ctx.fillRect(q[0],q[1],cd.b.w*z,cd.b.h*z);
      ctx.restore();
    });
  }
  drawPin(ctx,p[0],p[1],col,t);
  const mPer=100,px=mPer*z;
  const scaleInk=m.o.satellite?'rgba(244,246,255,.9)':P.ink2;
  ctx.save();
  ctx.strokeStyle=scaleInk;ctx.lineWidth=1.6;
  const bx=m.w-28-px,by=m.h-96;
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+px,by);ctx.moveTo(bx,by-5);ctx.lineTo(bx,by+5);
  ctx.moveTo(bx+px,by-5);ctx.lineTo(bx+px,by+5);ctx.stroke();
  ctx.font='600 12px "JetBrains Mono",ui-monospace,monospace';ctx.fillStyle=scaleInk;
  ctx.textAlign='center';ctx.fillText('100 m',bx+px/2,by-10);
  ctx.restore();
}
function custPick(w){

function stepperHtml(step){
  let h='<nav class="stepper" aria-label="progress">';
  STEPS.forEach((s,i)=>{
    const n=i+1,state=n<step?'done':n===step?'on':'';
    if(i)h+='<span class="bar'+(n<=step?' fill':'')+'"></span>';
    h+='<span class="st '+state+'"><span class="dot">'+(n<step?ico('check'):n)+'</span>'+
       '<span class="lb">'+s[LANG]+'</span></span>';
  });
  return h+'</nav>';
}

    const lab={city:'eCity',landmark:'eLandmark',prep:'ePrep',building:'eBuilding',micro:'eMicro',plain:'eOther'}[s.type]||'eOther';

  }).join('');

    city:p.entities.city?p.entities.city.en:null,
    area:(p.entities.areas||[])[0]||null,
    macro_landmark:(p.entities.landmarks||[])[0]||null,
    spatial_relation:(p.entities.preps||[]).map(x=>relOf(x))[0]||null,
    building:(p.entities.buildings||[])[0]||null,
    micro_location:(p.entities.micro||[]).join(' · ')||null,
    lat:curSc().center[0],lng:curSc().center[1],
    uncertainty_m:rec.radius,ghost_hits:c.ghosts.length,confidence:+(c.conf/100).toFixed(2)
  };
  const jsonHtml=Object.keys(jsonObj).map(k=>{
    const v=jsonObj[k];
    const vs=v===null?'<span style="color:#7c86a8">null</span>'
      :typeof v==='number'?'<span style="color:#8eb1ff">'+v+'</span>'
      :'<span style="color:#6ee7b7">"'+esc(v)+'"</span>';
    return '  <span style="color:#e9d5ff">"'+k+'"</span>: '+vs;
  }).join(',\n');
  // Cadastral enrichment section
  const off = c.backend && c.backend.official;
  const cadExplain = (c.backend && c.backend.explain || []).find(x => x.startsWith('cadastral:'));
  const cadHtml = off ? '<div style="background:linear-gradient(135deg,rgba(90,134,255,.08),rgba(109,40,217,.08));border-radius:14px;padding:14px 18px;margin-block:4px">'+

    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">'+
    (off.neighborhood?'<span class="pill good" style="font-size:15px">'+ico('pin')+off.neighborhood+'</span>':'')+
    (cadExplain?'<span style="font-size:14px;color:var(--text-2);line-height:1.5">'+esc(cadExplain.replace('cadastral: ',''))+'</span>':'')+
    '</div></div>' : '';

  card.innerHTML=
    '<div class="card-hd">'+ico('brain')+'<h3>'+t('engineTitle')+'</h3>'+
      (c.analysed?'<span class="pill lg '+(c.conf>=80?'good':c.conf>=60?'warn':'bad')+'" style="margin-inline-start:auto">'+
        ico('gauge')+t('confidence')+' '+c.conf+'%</span>':'')+'</div>'+
    '<div class="card-bd stack">'+
      '<div><span class="eyebrow">'+t('entities')+'</span><div class="tagline">'+tagHtml+'</div></div>'+

         compare with ===true. Overwriting it with an object silently turned

     so it wins: confirming has to write the pin, not just advance the step. */

/**
 * Post the pin. This tap is what turns a guess into a permanent fact, so it is
 * also the moment the backend graph learns — everything after it resolves at
 * tier 2, which is the whole demo.
 *
 * WHY THIS IS A FUNCTION AND NOT AN INLINE HANDLER: it used to live inside
 * `#fp-yes`'s onclick. When step 3 moved into the phone mockup, `#cust-ov`
 * stopped rendering, `renderMapUI()` began early-returning, `#fp-yes` was never
 * created, and the pin was silently never sent. The order was never created and
 * the neighbour effect could not be demonstrated. Two callers now share it.
 */
async function confirmFootprint(){
  S.c.footprint=true;
  if(!API.live || S.c.orderId) return;

  /* Prefer where the customer actually dragged the marker, then whatever the
     server resolved, then the canvas candidate for the offline simulation. */
  let lat=null,lng=null;
  if(S.c.pinLL){ lat=S.c.pinLL.lat; lng=S.c.pinLL.lng; }
  else if(S.c.backend && S.c.backend.lat!=null){ lat=S.c.backend.lat; lng=S.c.backend.lng; }
  else if(S.maps.cust?.city?.cands){
    const cand=S.maps.cust.city.cands[S.c.candIdx];
    const sc=curSc(), k=Math.cos(sc.center[0]*Math.PI/180);
    if(cand){ lat=sc.center[0]-cand.cy/110540; lng=sc.center[1]+cand.cx/(111320*k); }
  }
  if(lat==null) return;

  try{
    const order=await apiPost('/orders',{items:[{name:'حذاء رياضي',qty:1},{name:'حقيبة ظهر',qty:1}],
      phone:DEMO_PHONE, raw_address:S.c.text});
    S.c.orderId=order.id;
    if(order.pin_token){
      const pin=await apiPost('/pin/'+order.pin_token,{lat,lng});
      S.c.pinned={lat,lng,points:pin.points_pending,address_id:pin.address_id};
      toast(LANG==='ar'?('تم حفظ الموقع في الرسم البياني · +'+pin.points_pending+' نقطة قيد التأكيد')
                       :('Saved to the address graph · +'+pin.points_pending+' points pending'),'checkCircle');
    }
  }catch(e){ console.warn('pin sync failed', e); }
}

                           :['Main Street','Zeitoun Alley','School Slope','Jerusalem St'];

  return out;
}

const ROUTE_A=[[-300,210],[-300,50],[-140,50],[-140,-70],[30,-70],[30,-12],[6,-12]];
const ROUTE_B=[[-300,210],[-165,210],[-165,80],[-45,80],[-45,-12],[6,-12]];
const CP_AT=[-140,50];
function polyPt(pts,p){
  let tot=0;const segs=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);tot+=d;}
  let want=p*tot;
  for(let i=0;i<segs.length;i++){
    if(want<=segs[i]||i===segs.length-1){
      const k=segs[i]?clamp(want/segs[i],0,1):0;
      return [lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k),
              Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0])];
    }
    want-=segs[i];
  }
  return [pts[pts.length-1][0],pts[pts.length-1][1],0];
}
function drvProgress(t){
  const d=S.d;
  if(d.done)return 1;
  if(!d.navStarted)return 0;
  return clamp((t-d.t0)/16,0,0.94);
}
function drvOverlay(ctx,m){
  const d=S.d,t=m.t,z=m.cam.zoom;
  const route=d.rerouted?ROUTE_B:ROUTE_A;
  const sp=route.map(p=>m.s(p[0],p[1]));
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle=tint(P.brand,.28);ctx.lineWidth=Math.max(7,10*z);
  ctx.beginPath();sp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  ctx.strokeStyle=d.offline?P.brandSoft:P.brand;ctx.lineWidth=Math.max(3,4.5*z);
  ctx.setLineDash(d.offline?[9,6]:[]);ctx.lineDashOffset=-t*16;ctx.stroke();
  ctx.restore();
  // old (blocked) leg when rerouted
  if(d.rerouted){
    ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle=tint(P.bad,.6);ctx.lineWidth=2.4;
    ctx.beginPath();ROUTE_A.slice(1,4).forEach((p,i)=>{const q=m.s(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
    ctx.stroke();ctx.restore();
  }
  // checkpoint
  if(d.cpType||d.rerouted){
    const cp=m.s(CP_AT[0],CP_AT[1]);
    drawHalo(ctx,cp[0],cp[1],26,P.bad,t);
    ctx.save();ctx.fillStyle=P.bad;ctx.beginPath();
    ctx.moveTo(cp[0],cp[1]-9);ctx.lineTo(cp[0]+9,cp[1]+6);ctx.lineTo(cp[0]-9,cp[1]+6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 11px "Plus Jakarta Sans",system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('!',cp[0],cp[1]+4);ctx.restore();
  }
  // destination
  const dst=m.s(route[route.length-1][0],route[route.length-1][1]);
  dashRing(ctx,dst[0],dst[1],20,P.good,tint(P.good,.14),t);
  drawPin(ctx,dst[0],dst[1],P.good,t);
  // vehicle
  const pr=drvProgress(t),pos=polyPt(route,pr),vp=m.s(pos[0],pos[1]);
  ctx.save();ctx.translate(vp[0],vp[1]);
  ctx.fillStyle=tint(P.brand,.28);ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
  ctx.rotate(pos[2]);
  ctx.fillStyle=P.brand;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,6);ctx.lineTo(-3,0);ctx.lineTo(-6,-6);
  ctx.closePath();ctx.fill();ctx.restore();
  if(d.offline){
    ctx.save();ctx.fillStyle='rgba(15,23,42,.30)';ctx.fillRect(0,0,m.w,m.h);
    ctx.strokeStyle=tint(P.brandSoft,.2);ctx.lineWidth=1;
    for(let i=0;i<m.h;i+=4){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(m.w,i);ctx.stroke();}
    ctx.restore();
  }
}

const INCIDENT_LL=[[31.6975,35.1908],[31.9033,35.2058],[31.7300,35.2700]];
function fleetOverlay(ctx,m){
  const t=m.t;
  const hubPts=HUBS.map(h=>{const w=REGION.pr(h.ll[0],h.ll[1]);return m.s(w[0],w[1]);});
  const hubR=HUBS.map(h=>8+Math.sqrt(h.n)*0.55);
  // pass 1 — hub discs (drivers ride on top, numerals go last so nothing occludes them)
  HUBS.forEach((h,i)=>{
    const p=hubPts[i],r=hubR[i];
    ctx.save();
    ctx.fillStyle=tint(P.brand,.16);ctx.beginPath();ctx.arc(p[0],p[1],r+5,0,7);ctx.fill();
    ctx.fillStyle=P.hubFill;ctx.strokeStyle=P.brand;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();ctx.stroke();
    ctx.restore();
  });
  // incidents — pinned to a fixed offset with a leader so they never sit on a hub numeral
  INCIDENT_LL.forEach((ll,i)=>{
    const w=REGION.pr(ll[0],ll[1]),a=m.s(w[0],w[1]);
    // shove the badge directly away from whichever hub is nearest, so it can
    // never land on a parcel count no matter how the camera moves
    let nx=0.72,ny=-0.72,bd=1e9,br=14;
    HUBS.forEach((h,j)=>{
      const dx=a[0]-hubPts[j][0],dy=a[1]-hubPts[j][1],d=Math.hypot(dx,dy);
      if(d<bd){bd=d;br=hubR[j];if(d>2){nx=dx/d;ny=dy/d;}}
    });
    const off=br+22;
    const p=[a[0]+nx*off,a[1]+ny*off];
    ctx.save();
    ctx.strokeStyle=tint(P.bad,.65);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
    ctx.fillStyle=P.bad;ctx.beginPath();ctx.arc(a[0],a[1],2.4,0,7);ctx.fill();
    ctx.restore();
    drawHalo(ctx,p[0],p[1],20,P.bad,t+i*0.6);
    ctx.save();ctx.fillStyle=P.bad;ctx.strokeStyle=P.gBg;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(p[0],p[1]-8);ctx.lineTo(p[0]+8,p[1]+5);ctx.lineTo(p[0]-8,p[1]+5);ctx.closePath();
    ctx.stroke();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 10px "Plus Jakarta Sans",system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('!',p[0],p[1]+3.5);ctx.restore();
  });
  // pass 2 — drivers, orbiting just outside their hub disc so they never sit on a numeral
  DRIVERS.forEach((d,i)=>{
    const w=REGION.pr(d.ll[0],d.ll[1]),c=m.s(w[0],w[1]);
    let orbit=17;
    HUBS.forEach((h,j)=>{if(Math.hypot(hubPts[j][0]-c[0],hubPts[j][1]-c[1])<8)orbit=hubR[j]+16;});
    const a=t*0.22+i*1.9;
    const p=[c[0]+Math.cos(a)*orbit,c[1]+Math.sin(a)*orbit];
    const col=d.st==='online'?P.brand:d.st==='offline'?P.warn:P.muted;
    ctx.save();
    if(d.st==='online')drawHalo(ctx,p[0],p[1],15,col,t+i);
    ctx.fillStyle=col;ctx.strokeStyle=P.surface;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(p[0],p[1],5.5,0,7);ctx.fill();ctx.stroke();
    ctx.restore();
  });
  // pass 3 — parcel counts and city names on top of everything
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.direction=LANG==='ar'?'rtl':'ltr';
  HUBS.forEach((h,i)=>{
    const p=hubPts[i],r=hubR[i];
    ctx.font='800 '+Math.max(9.5,Math.min(13,r*0.85))+'px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.fillStyle=P.brand;ctx.fillText(String(h.n),p[0],p[1]);
    ctx.font='600 10.5px '+(LANG==='ar'?'Tajawal,"SF Arabic",sans-serif':'"Plus Jakarta Sans",system-ui');
    ctx.lineWidth=3.6;ctx.strokeStyle=P.labelHalo;
    ctx.strokeText(h[LANG],p[0],p[1]+r+12);
    ctx.fillStyle=P.ink2;ctx.fillText(h[LANG],p[0],p[1]+r+12);
  });
  ctx.restore();
}
