/* The same parser that reads addresses reads Palestine's road chatter.
   Paste a real dialect Telegram message and watch a checkpoint change colour. */
function wireRoadSim(){
  const go=$('#road-go'); if(!go) return;
  go.onclick=async ()=>{
    const text=$('#road-in').value.trim(); if(!text) return;
    const out=$('#road-out');
    if(!API.live){
      out.innerHTML='<div class="banner warn">'+ico('alert')+'<span>'+
        (LANG==='ar'?'وضع العرض — شغّل الخادم لتحديث الخريطة فعلياً'
                   :'Simulation mode — start the backend to move the map for real')+'</span></div>';
      return;
    }
    out.innerHTML='<div class="banner info">'+ico('sparkles')+'<span>'+
      (LANG==='ar'?'جارٍ التحليل…':'parsing…')+'</span></div>';
    try{
      const r=await apiPost('/ingest/road-post',{text, source:'telegram'});
      const hits=(r.matched||[]).filter(m=>m.matched);
      const html=
        '<div class="banner '+(hits.length?'good':'warn')+'">'+ico(hits.length?'checkCircle':'alert')+
        '<span>'+(hits.length
          ? (LANG==='ar'?('طابَق '+hits.length+' حاجز — '):('matched '+hits.length+' checkpoint(s) — '))+
            hits.map(h=>esc(h.matched)+' → '+h.status).join(LANG==='ar'?'، ':', ')
          : (LANG==='ar'?'لم يُطابق أي حاجز معروف':'no known checkpoint matched'))+'</span></div>'+
        '<div class="log" style="margin-block-start:12px;max-height:160px">'+
          (r.parsed.mentions||[]).map(m=>'<div class="ln c-key">mention -> "'+esc(m.place)+
            '"  kind='+m.kind+'  status='+m.status+'</div>').join('')+
          '<div class="ln c-ok">engine = '+esc(r.parsed.engine||'llm')+'</div></div>';
      out.innerHTML=html;
      S.x.roadSim={text, html};          // survives the repaint below
      await loadDispatch();
      renderDispatch();
    }catch(e){
      out.innerHTML='<div class="banner bad">'+ico('alert')+'<span>'+esc(e.message)+'</span></div>';
    }
  };
}
/* Measured location accuracy, from `npm run bench`.
   Location accuracy is 30% of the score, so it gets a real measurement rather
   than an adjective. The BAR is "% located within 100 m" — a linear 0-100
   scale that can be read honestly. The median error sits beside it as a
   number, because a bar chart spanning 1270 m to 9 m would need a log scale
   and a log scale on stage is a chart nobody trusts. */
function accuracyPanel(){
  const a=S.x.accuracy;
  if(!a) return '';
  const CH=chart(), tones=[CH.violet,CH.blue,CH.green];
  const names=[
    {ar:'تطبيق خرائط عادي',en:'A normal mapping app'},
    {ar:'وصول — من النص فقط',en:'Wusool — from the text alone'},
    {ar:'وصول — بعد تثبيت واحد',en:'Wusool — after ONE pin'}];
  /* Arabic unit words, not "km"/"m". A Latin unit next to a digit inside an RTL
     line gets reordered by the bidi algorithm and renders as "km 1.3". */
  const U=LANG==='ar'?{km:'كم',m:'م'}:{km:'km',m:'m'};
  const fmt=v=>v>=1000?(v/1000).toFixed(1)+' '+U.km:v+' '+U.m;
  return '<div class="card" style="margin-block-end:20px">'+
    '<div class="card-hd">'+ico('crosshair')+'<h3>'+
      (LANG==='ar'?'دقة تحديد الموقع — مقاسة':'Location accuracy — measured')+'</h3>'+
      '<span class="pill sm" style="margin-inline-start:auto">'+a.sample_size+' '+
      (LANG==='ar'?'مبنى':'buildings')+'</span></div>'+
    '<div class="card-bd">'+
     '<div style="display:flex;flex-direction:column;gap:16px">'+
      a.rows.map((r,i)=>
       '<div>'+
        '<div style="display:flex;align-items:baseline;gap:10px;margin-block-end:6px">'+
         '<span style="font-size:14px;color:var(--text-1);font-weight:600">'+esc(names[i][LANG])+'</span>'+
         '<b class="tnum" style="margin-inline-start:auto;font-size:19px;color:'+tones[i]+'">'+
           fmt(r.median_m)+'</b>'+
         '<span style="font-size:11.5px;color:var(--text-3)">'+
           (LANG==='ar'?'خطأ وسيط':'median error')+'</span></div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
         '<span style="flex:1;height:12px;background:var(--track);border-radius:999px;overflow:hidden;display:block">'+
          '<i style="display:block;height:100%;width:'+(r.within_100m*100).toFixed(1)+
            '%;background:'+tones[i]+';border-radius:999px;transition:width .7s cubic-bezier(.22,1,.36,1)"></i></span>'+
         '<b class="tnum" style="flex:0 0 46px;text-align:end;font-size:13px">'+
           Math.round(r.within_100m*100)+'%</b></div>'+
       '</div>').join('')+
     '</div>'+
     '<div class="note" style="margin-block-start:16px">'+
       (LANG==='ar'
        ? 'الشريط = نسبة العناوين المحدَّدة ضمن ١٠٠ متر. قياس فعلي على '+a.sample_size+
          ' مبنى بإحداثيات معروفة، مع خطأ GPS ±'+a.pin_error_m+' م على كل تثبيت.'
        : 'Bar = share of addresses located within 100 m. Measured against '+a.sample_size+
          ' buildings with known coordinates, with ±'+a.pin_error_m+' m of GPS error on every pin.')+
     '</div>'+
    '</div></div>';
}

function wireCharts(lc){
  const CH=chart();
  const wrap=$('#lc-wrap');
  if(wrap){
    const svg=wrap.querySelector('svg'),cross=wrap.querySelector('.cross');
    $$('.hit',wrap).forEach(r=>{
      r.addEventListener('mouseenter',e=>{
        const i=+r.dataset.i,bb=svg.getBoundingClientRect();
        const scale=bb.width/lc.W;
        cross.setAttribute('x1',lc.X(i));cross.setAttribute('x2',lc.X(i));cross.setAttribute('opacity','.5');
        showTip(bb.left+lc.X(i)*scale,bb.top+lc.Y(Math.max(SERIES_BEFORE[i],SERIES_AFTER[i]))*scale,
          '<div class="th">'+WEEKS[i]+'</div>'+
          '<div class="tr"><i style="background:'+CH.violet+'"></i>'+t('before')+'<b>'+SERIES_BEFORE[i]+' '+t('min')+'</b></div>'+
          '<div class="tr"><i style="background:'+CH.green+'"></i>'+t('after')+'<b>'+SERIES_AFTER[i]+' '+t('min')+'</b></div>');
      });
      r.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');hideTip();});
    });
  }
  $$('.seg-hit').forEach(s=>{
    s.addEventListener('mouseenter',e=>{
      const o=OUTCOME[+s.dataset.i],b=s.getBoundingClientRect();
      showTip(b.left+b.width/2,b.top,'<div class="tr"><i style="background:'+o.c+'"></i>'+t(o.k)+'<b>'+o.v+'%</b></div>');
    });
    s.addEventListener('mouseleave',hideTip);
  });
  $$('.bar-hit').forEach(s=>{
    s.addEventListener('mouseenter',()=>{
      const it=CITY_PARCELS[+s.dataset.i],b=s.getBoundingClientRect();
      showTip(b.left+b.width/2,b.top,'<div class="th">'+esc(it[LANG])+'</div><div class="tr">'+t('parcels')+'<b>'+it.v+'</b></div>');
    });
    s.addEventListener('mouseleave',hideTip);
  });
  $$('.spark[data-vals]').forEach(sp=>{
    const vals=sp.dataset.vals.split(',').map(Number);
    sp.addEventListener('mousemove',e=>{
      const b=sp.getBoundingClientRect();
      const i=clamp(Math.round((e.clientX-b.left)/b.width*(vals.length-1)),0,vals.length-1);
      showTip(b.left+(i/(vals.length-1))*b.width,b.top,
        '<div class="th">'+WEEKS[i]+'</div><div class="tr"><i style="background:'+sp.dataset.color+'"></i>'+
        sp.dataset.label+'<b>'+vals[i]+'</b></div>');
    });
    sp.addEventListener('mouseleave',hideTip);
  });
}

const ROLES=[{id:'customer',k:'roleCustomer',ic:'cart'},

function renderRoles(){

async function setRole(id){
  S.role=id;
  $$('.panel').forEach(p=>p.classList.remove('active'));
  $('#panel-'+id).classList.add('active');
  renderRoles();
  if(id==='customer')renderCustomer();

  if(id==='dispatch'){ await loadDispatch(); renderDispatch(); }
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  $('#wm').textContent=LANG==='ar'?'وصول':'Wusool';
  $('#wmsub').textContent=t('brandSub');
  const mp=$('#modepill'); if(mp) mp.outerHTML=modePill();
  $$('#langtog button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  renderRoles();
}
function setLang(l){
  if(l===LANG)return;
  const c=S.c,sc=curSc();
  const wasPreset=c.presetId===sc.id;
  LANG=l;applyLang();
  if(wasPreset){c.text=sc.raw[LANG];c.presetId=sc.id;}
  seedFeed();
  setRole(S.role);
  // the parse output is language-bound — re-run it, but keep the map pin
  if(c.analysed){c.keepPin=(c.footprint===true);runAnalyse().then(renderEngine);}
}
function startClock(){
  const el=$('#clock');
  const tick=()=>{
    const d=new Date();
    const p=n=>String(n).padStart(2,'0');
    el.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  UTC+3';
  };
  tick();setInterval(tick,1000);
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='1')setRole('customer');
  if(e.key==='2')setRole('driver');
  if(e.key==='3')setRole('dispatch');
});
$$('#langtog button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
window.addEventListener('resize',()=>{Object.keys(S.maps).forEach(k=>{const m=S.maps[k];if(m)m.resize();});
  drawDoorPhotos();});
